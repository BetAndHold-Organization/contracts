version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: roulette
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d roulette']
      interval: 5s
      timeout: 3s
      retries: 20

  graphql:
    build: .
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/roulette
      RPC_URL: https://arbitrum-sepolia.infura.io/v3/3d3aca3f945f4ebe8b06d5a1acc2d25e
      RPC_WS_URL: wss://arbitrum-sepolia.infura.io/ws/v3/3d3aca3f945f4ebe8b06d5a1acc2d25e
      DEPLOYMENTS_PATH: /app/scripts/testnet/deployments/arb-sepolia.json
      HARDFORK_MNEMONIC: "test test test test test test test test test test test junk"
      ADMIN_API_KEY: changeme
      PORT: 4000
    volumes:
      - ../scripts/testnet/deployments:/app/scripts/testnet/deployments:ro
      - ../artifacts:/app/artifacts:ro
    ports:
      - "4000:4000"

  indexer:
    build: .
    working_dir: /app
    depends_on:
      - postgres
    command: ['npm', 'run', 'indexer']
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/roulette
      RPC_URL: https://arbitrum-sepolia.infura.io/v3/3d3aca3f945f4ebe8b06d5a1acc2d25e
      RPC_WS_URL: wss://arbitrum-sepolia.infura.io/ws/v3/3d3aca3f945f4ebe8b06d5a1acc2d25e
      DEPLOYMENTS_PATH: /app/scripts/testnet/deployments/arb-sepolia.json
      START_BLOCK: "217274628"
      HARDFORK_MNEMONIC: "test test test test test test test test test test test junk"
      ADMIN_API_KEY: changeme
    volumes:
      - ../scripts/testnet/deployments:/app/scripts/testnet/deployments:ro
      - ../artifacts:/app/artifacts:ro

volumes:
  postgres_data:

